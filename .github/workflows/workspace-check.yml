# The workspace repo holds documents, the manifest and the scripts. This check is what makes
# `main` trustworthy mechanically: the generated spec copies match the plan, the scripts parse,
# the manifest reads, and a bootstrap dry run resolves every entry in repos.yaml.
name: workspace-check
on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done; python3 -m py_compile scripts/extract_spec.py
      - name: Manifest reads
        run: scripts/repos.sh list && for r in $(scripts/repos.sh list); do printf '%-18s %s\n' "$r" "$(scripts/repos.sh get "$r" role)"; done
      - name: Generated spec copies match the plan (the parts that live in this repo)
        run: scripts/extract-spec.sh --check-workspace
      - name: Bootstrap dry run
        run: NO_COLOR=1 scripts/bootstrap.sh --dry-run --no-venv
      - name: Every ref/ pin still resolves upstream
        run: |
          set -e
          for r in $(scripts/repos.sh list); do
            [ "$(scripts/repos.sh get "$r" role)" = reference ] || continue
            url=$(scripts/repos.sh get "$r" url); tag=$(scripts/repos.sh get "$r" tag); commit=$(scripts/repos.sh get "$r" commit)
            # An annotated tag lists the tag object and, with ^{}, the peeled commit: take the peel.
            if [ -n "$tag" ]; then out=$(git ls-remote --tags "$url" "refs/tags/$tag" "refs/tags/$tag^{}"); at=$(printf '%s\n' "$out" | awk '/\^\{\}$/{print $1; f=1} END{if(!f) exit 1}') || at=$(printf '%s\n' "$out" | awk 'NR==1{print $1}')
            else at=$(git ls-remote "$url" | awk -v c="$commit" 'index($1,c)==1{print $1; exit}'); [ -n "$at" ] || at=$commit; fi
            case "$at" in "$commit"*) echo "ok   $r ${tag:-commit} $commit";; *) echo "MOVED $r: $tag now $at, manifest says $commit"; exit 1;; esac
          done
