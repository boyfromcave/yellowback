# The workspace repo holds documents, the manifest and the scripts. This check is what makes
# `main` trustworthy mechanically: the generated spec copies match the plan, the scripts parse,
# the manifest reads, and a bootstrap dry run resolves every entry in repos.yaml.
name: workspace-check
on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.11' }
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done; python3 -m py_compile scripts/extract_spec.py
      - name: Manifest reads
        run: scripts/repos.sh list && for r in $(scripts/repos.sh list); do printf '%-18s %s\n' "$r" "$(scripts/repos.sh get "$r" role)"; done
      - name: Generated spec copies match the plan (the parts that live in this repo)
        run: scripts/extract-spec.sh --check-workspace
      - name: Bootstrap dry run
        run: NO_COLOR=1 scripts/bootstrap.sh --dry-run --no-venv
      # A tag pin must still name the recorded commit; a commit pin (upstream has no tags) must still be
      # in the history of its recorded upstream branch (only the commit graph is fetched).
      - name: Every ref/ pin still holds upstream (tags and commit pins)
        run: scripts/check-ref-pins.sh
