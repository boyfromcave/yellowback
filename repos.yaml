# yellowback-workspace — repository manifest.
#
# The single source of truth for which repositories make up this workspace, where they come
# from, and what they are pinned to. Read by scripts/repos.sh, which feeds scripts/bootstrap.sh
# (`make bootstrap`) and the Makefile (`make status` pin checks). Not git submodules: every
# entry is a plain nested clone, gitignored by the workspace repo, that any developer recreates
# with `make bootstrap`.
#
# Kept deliberately flat so a shell script can parse it:
#   - a repository starts with an unindented `<path>:` line
#   - each field is exactly two spaces of indent, `key: value`, one per line
#   - no lists, no quoting, no anchors; a trailing `# comment` on a field line is stripped
#
# Roles:
#   reference  read-only. Detached at `tag`; `commit` is the tag's commit (a short prefix is
#              enough) and is verified after checkout; the working tree is `chmod -R a-w`.
#              A repository that publishes no tags omits `tag`: it is detached at `commit`
#              itself, and `branch` records which upstream branch that commit was taken from.
#   fork       writable. `branch` is checked out; `base` (the pristine baseline the fork diff
#              is measured against) is created as a local tracking branch; `base-commit` must
#              equal the matching reference pin; `upstream` is added as a remote, not fetched.
#   app        writable. `branch` is checked out; no `base`, no `upstream`, not `chmod a-w`.
#              A repository of its own (nothing is ported into it), so there is no baseline to
#              diff against: `make status` only checks it is on `branch`; `make diff`/`make log`
#              skip it.
#
# Re-pinning a reference is rare and deliberate: change `tag` and `commit` here, then update
# the mirrors in AGENTS.md and docs/mapping.md — every file:line citation depends on them.

ref/digibyte:
