# SKELETON (beta4 item 10, "every repo beta4-compatible"): the shape of the 6.22.0-beta4 train, written
# before its commits exist. Every `placeholder` is filled in by the coordinator at qualification; while
# one remains, `scripts/release-train.py pins` refuses this file, so the qualification harness (qualify/,
# .github/workflows/rc-qualify.yml) cannot run against it. Known beta4 commits are filled in already.
# kogany is not a section here: the train names the qualified lines and their clients only (AGENTS.md,
# "The third node line"; kogany plan K-19).
